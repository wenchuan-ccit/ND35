<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動詞記憶配對遊戲 (Verb Memory Matching Game)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        :root {
            --primary-color: #bde0fe; /* Light Blue */
            --secondary-color: #ffb703;
            --background-color: #fefae0;
            --card-front-color: #219ebc;
            --card-back-color: #ffffff;
            --success-color: #70e000;
            --error-color: #e63946;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            user-select: none;
        }

        #game-wrapper {
            width: 1200px;
            max-width: 95%;
            background: var(--card-back-color);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 25px 35px;
            text-align: center;
        }

        h1 {
            color: var(--card-front-color);
            margin-bottom: 20px;
        }

        #game-controls, #game-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        #game-info span {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
            background: #f1f1f1;
            padding: 8px 15px;
            border-radius: 8px;
        }
        #game-info #high-score { color: var(--error-color); }

        .btn {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            border: 2px solid var(--primary-color);
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: black;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: var(--primary-color);
            color: black;
            border-color: var(--primary-color);
        }
        .btn-secondary:hover {
            background-color: var(--secondary-color);
            color: black;
            border-color: var(--secondary-color);
        }
        .btn-secondary.active {
            background-color: var(--secondary-color);
            color: black;
            border-color: var(--error-color);
        }
        .btn:disabled {
            background-color: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            perspective: 1000px; /* For 3D flip effect */
        }

        .card {
            width: 100%;
            aspect-ratio: 2.5 / 1; /* Maintain card shape, made wider to reduce height */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .card.flip {
            transform: rotateY(180deg);
        }
        .card.matched {
            transform: scale(0);
            transition: transform 0.3s;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card-front {
            background: var(--card-front-color);
            color: white;
        }
        .card-back {
            background: var(--card-back-color);
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #ddd;
        }
        .card-back.correct {
            border: 3px solid var(--success-color);
        }
        .card-back.incorrect {
            border: 3px solid var(--error-color);
        }

        .card-back.selected {
            border: 3px solid var(--secondary-color);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: white; padding: 30px 40px; border-radius: 15px;
            text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <h1>動詞記憶配對遊戲 (Verb Memory Matching Game)</h1>
        <div id="game-controls">
            <div>
                <button id="mode-simple" class="btn btn-secondary active">簡單模式 (Simple)</button>
                <button id="mode-hard" class="btn btn-secondary">困難模式 (Hard)</button>
            </div>
            <button id="start-button" class="btn btn-primary">開始遊戲 (Start Game)</button>
            <button id="restart-button-main" class="btn btn-primary">重新開始 (Restart)</button>
        </div>
        <div id="game-info">
            <span id="score">分數 (Score)：0</span>
            <span id="high-score">最高分 (High Score)：0</span>
            <span id="timer">時間 (Time)：0 秒 (s)</span>
        </div>
        <hr>
        <div id="game-board"></div>
    </div>
    
    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">恭喜！ (Congratulations!)</h2>
            <p id="final-score"></p>
            <p id="final-time"></p>
            <p id="new-high-score-msg" style="display: none;">🎉 恭喜打破紀錄！ (New High Score!) 🎉</p>
            <button id="restart-button" class="btn btn-primary">重新開始 (Restart)</button>
        </div>
    </div>

    <script>
        const allVerbs = [
            { present: 'be (am/is/are)', past: 'was/were' }, { present: 'begin', past: 'began' },
            { present: 'break', past: 'broke' }, { present: 'bring', past: 'brought' },
            { present: 'buy', past: 'bought' }, { present: 'build', past: 'built' },
            { present: 'catch', past: 'caught' }, { present: 'come', past: 'came' },
            { present: 'do', past: 'did' }, { present: 'draw', past: 'drew' },
            { present: 'drink', past: 'drank' }, { present: 'drive', past: 'drove' },
            { present: 'eat', past: 'ate' }, { present: 'fall', past: 'fell' },
            { present: 'feel', past: 'felt' }, { present: 'find', past: 'found' },
            { present: 'fly', past: 'flew' }, { present: 'forget', past: 'forgot' },
            { present: 'get', past: 'got' }, { present: 'give', past: 'gave' },
            { present: 'go', past: 'went' }, { present: 'have', past: 'had' },
            { present: 'hear', past: 'heard' }, { present: 'hold', past: 'held' },
            { present: 'hurt', past: 'hurt' }, { present: 'keep', past: 'kept' },
            { present: 'know', past: 'knew' }, { present: 'leave', past: 'left' },
            { present: 'let', past: 'let' }, { present: 'lose', past: 'lost' },
            { present: 'make', past: 'made' }, { present: 'meet', past: 'met' },
            { present: 'pay', past: 'paid' }, { present: 'put', past: 'put' },
            { present: 'read', past: 'read' }, { present: 'ride', past: 'rode' },
            { present: 'run', past: 'ran' }, { present: 'say', past: 'said' },
            { present: 'see', past: 'saw' }, { present: 'sell', past: 'sold' },
            { present: 'send', past: 'sent' }, { present: 'sing', past: 'sang' },
            { present: 'sit', past: 'sat' }, { present: 'sleep', past: 'slept' },
            { present: 'speak', past: 'spoke' }, { present: 'spend', past: 'spent' },
            { present: 'stand', past: 'stood' }, { present: 'swim', past: 'swam' },
            { present: 'take', past: 'took' }, { present: 'teach', past: 'taught' },
            { present: 'tell', past: 'told' }, { present: 'think', past: 'thought' },
            { present: 'throw', past: 'threw' }, { present: 'understand', past: 'understood' },
            { present: 'wake', past: 'woke' }, { present: 'wear', past: 'wore' },
            { present: 'win', past: 'won' }, { present: 'write', past: 'wrote' },
            { present: 'ask', past: 'asked' }, { present: 'answer', past: 'answered' },
            { present: 'brush', past: 'brushed' }, { present: 'call', past: 'called' },
            { present: 'clean', past: 'cleaned' }, { present: 'close', past: 'closed' },
            { present: 'cook', past: 'cooked' }, { present: 'count', past: 'counted' },
            { present: 'cry', past: 'cried' }, { present: 'dance', past: 'danced' },
            { present: 'enjoy', past: 'enjoyed' }, { present: 'finish', past: 'finished' },
            { present: 'help', past: 'helped' }, { present: 'jump', past: 'jumped' },
            { present: 'kick', past: 'kicked' }, { present: 'like', past: 'liked' },
            { present: 'listen', past: 'listened' }, { present: 'live', past: 'lived' },
            { present: 'look', past: 'looked' }, { present: 'love', past: 'loved' },
            { present: 'need', past: 'needed' }, { present: 'open', past: 'opened' },
            { present: 'paint', past: 'painted' }, { present: 'play', past: 'played' },
            { present: 'rain', past: 'rained' }, { present: 'remember', past: 'remembered' },
            { present: 'share', past: 'shared' }, { present: 'smile', past: 'smiled' },
            { present: 'start', past: 'started' }, { present: 'stay', past: 'stayed' },
            { present: 'stop', past: 'stopped' }, { present: 'study', past: 'studied' },
            { present: 'talk', past: 'talked' }, { present: 'touch', past: 'touched' },
            { present: 'try', past: 'tried' }, { present: 'use', past: 'used' },
            { present: 'visit', past: 'visited' }, { present: 'wait', past: 'waited' },
            { present: 'walk', past: 'walked' }, { present: 'want', past: 'wanted' },
            { present: 'wash', past: 'washed' }, { present: 'watch', past: 'watched' }
        ];

        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const highScoreDisplay = document.getElementById('high-score');
        const startButton = document.getElementById('start-button');
        const modeSimpleBtn = document.getElementById('mode-simple');
        const modeHardBtn = document.getElementById('mode-hard');
        const gameOverModal = document.getElementById('game-over-modal');
        const restartButtonMain = document.getElementById('restart-button-main');

        let gameMode = 'simple';
        let score = 0;
        let seconds = 0;
        let timer;
        let highScore = 0;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let pairsMatched = 0;
        const PAIRS_TO_PLAY = 15;

        function init() {
            highScore = localStorage.getItem('verbMemoryHighScore') || 0;
            highScoreDisplay.textContent = `最高分 (High Score)：${highScore}`;

            modeSimpleBtn.addEventListener('click', () => setMode('simple'));
            modeHardBtn.addEventListener('click', () => setMode('hard'));
            startButton.addEventListener('click', startGame);
            restartButtonMain.addEventListener('click', startGame);
            document.getElementById('restart-button').addEventListener('click', startGame);
        }

        function setMode(mode) {
            gameMode = mode;
            modeSimpleBtn.classList.toggle('active', mode === 'simple');
            modeHardBtn.classList.toggle('active', mode === 'hard');
        }

        function startGame() {
            resetGame();
            
            const gameVerbs = [...allVerbs].sort(() => 0.5 - Math.random()).slice(0, PAIRS_TO_PLAY);
            let cardsData = [];
            gameVerbs.forEach((verb, index) => {
                cardsData.push({ word: verb.present, pairId: index });
                cardsData.push({ word: verb.past, pairId: index });
            });
            
            cardsData.sort(() => 0.5 - Math.random());
            
            cardsData.forEach(data => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.pairId = data.pairId;
                
                card.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-face card-back">${data.word}</div>
                `;
                
                gameBoard.appendChild(card);
                card.addEventListener('click', flipCard);

                if (gameMode === 'simple') {
                    card.classList.add('flip');
                }
            });
            
            timer = setInterval(() => {
                seconds++;
                timerDisplay.textContent = `時間 (Time)：${seconds} 秒 (s)`;
            }, 1000);
        }
        
        function resetGame(){
            score = 0;
            seconds = 0;
            pairsMatched = 0;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            scoreDisplay.textContent = `分數 (Score)：${score}`;
            timerDisplay.textContent = `時間 (Time)：${seconds} 秒 (s)`;
            gameBoard.innerHTML = '';
            clearInterval(timer);
            gameOverModal.classList.remove('show');
        }

        function flipCard() {
            if (lockBoard || this === firstCard || this.classList.contains('matched')) return;

            this.classList.add('flip');

            if (gameMode === 'simple') {
                this.querySelector('.card-back').classList.add('selected');
            }

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            lockBoard = true;
            const isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;
            isMatch ? handleMatch() : handleMismatch();
        }
        
        function handleMatch(){
            score += 10;
            pairsMatched++;
            
            // Visual feedback
            firstCard.querySelector('.card-back').classList.add('correct');
            secondCard.querySelector('.card-back').classList.add('correct');

            setTimeout(() => {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                resetBoard();

                if (pairsMatched === PAIRS_TO_PLAY) {
                    endGame();
                }
            }, 800);
        }

        function handleMismatch(){
            if (gameMode === 'simple') {
                score = Math.max(0, score - 5);
            }
            
            // Visual feedback: Add red border
            firstCard.querySelector('.card-back').classList.add('incorrect');
            secondCard.querySelector('.card-back').classList.add('incorrect');

            // In simple mode, remove the blue selection glow
            if (gameMode === 'simple') {
                firstCard.querySelector('.card-back').classList.remove('selected');
                secondCard.querySelector('.card-back').classList.remove('selected');
            }
            
            setTimeout(() => {
                if(gameMode === 'hard'){
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                }
                // Remove red border after delay
                firstCard.querySelector('.card-back').classList.remove('incorrect');
                secondCard.querySelector('.card-back').classList.remove('incorrect');
                resetBoard();
            }, 1200);
        }
        
        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
            scoreDisplay.textContent = `分數 (Score)：${score}`;
        }

        function endGame() {
            clearInterval(timer);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('verbMemoryHighScore', highScore);
                highScoreDisplay.textContent = `最高分 (High Score)：${highScore}`;
                document.getElementById('new-high-score-msg').style.display = 'block';
            } else {
                 document.getElementById('new-high-score-msg').style.display = 'none';
            }
            
            document.getElementById('final-score').textContent = `你的總分是 (Your final score is)：${score}`;
            document.getElementById('final-time').textContent = `花費時間 (Time spent)：${seconds} 秒 (s)`;
            gameOverModal.classList.add('show');
        }

        init();
    </script>
</body>
</html>
